# Placeholder model names: edit to match what you have installed.
name = "light"
fast = "text"

[text]
kind = "openai"
base_url = "http://127.0.0.1:8081"
model = "lfm3"
managed = true
launch = ["llama-server","-m","models/lfm3.gguf","--port","8081","-ngl","0"]
# LFM3 thinks before answering by default, which leaves short jobs empty: turn it off
[text.extra]
chat_template_kwargs = { enable_thinking = false }

# Web search for the "web" source: "duckduckgo" (default), "searxng", "brave" or "off".
# [web]
# search = "duckduckgo"
# searxng_url = "http://127.0.0.1:8888"
# api_key_file = "var/keys/brave.key"

# Voice for Listen (a page read aloud) and Story (illustrated, narrated scenes). Uncomment and
# edit; until then those buttons show as unavailable. LFM3-Audio on llama-server runs on the CPU
# (the base_url must be on this machine):
# [voice]
# kind = "lfm3"
# base_url = "http://127.0.0.1:8840"
# voice = "female"
# managed = true
# launch = ["llama-server", "-m", "C:/path/to/LFM3-Audio-2B-Q8_0.gguf",
#           "--mmproj", "C:/path/to/mmproj-LFM3-Audio-2B-F16.gguf", "--port", "8840", "-ngl", "0"]
# Or any OpenAI-style speech endpoint (kind = "openai", model, optional api_key_file).
