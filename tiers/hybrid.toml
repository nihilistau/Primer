# Placeholder model names: edit to match what you have installed.
name = "hybrid"

[text]
kind = "openai"
base_url = "http://127.0.0.1:1234"
model = "gemma-4-26b-a4b"
managed = true
gpu = true
# LM Studio loads the model on first request
launch = ["lms", "server", "start"]
# `lms server start` exits once the server is up, so Primer stops it with this command
stop = ["lms", "server", "stop"]
# With gpu = true, auto GPU mode runs this while an image is made: it frees the VRAM but keeps
# LM Studio's server up, and the model loads again on the next page (Just-in-Time loading)
pause = ["lms", "unload", "--all"]
# If LM Studio requires an API token (HTTP 401), put the key in this file:
# api_key_file = "var/keys/lmstudio.key"

# Alternative text engine (Shannon-Prime server):
# [text]
# kind = "sp"
# base_url = "http://127.0.0.1:3000"

[fast]
kind = "openai"
base_url = "http://127.0.0.1:8081"
model = "lfm3"
managed = true
launch = ["llama-server","-m","models/lfm3.gguf","--port","8081","-ngl","0"]
# LFM3 thinks before answering by default, which leaves short jobs empty: turn it off
[fast.extra]
chat_template_kwargs = { enable_thinking = false }

# Image generation (stable-diffusion.cpp). Uncomment and set sd_server to your own
# sd-server executable; until then image generation shows as unavailable.
# [images]
# sd_server = "C:/path/to/stable-diffusion.cpp/sd-server.exe"
# port = 8820

# Offline reference (a Primer-managed kiwix-serve over ZIM files). Uncomment and edit; the
# book listed first wins when the same article is in several. Until then the "offline
# reference" source shows as unavailable. Use base_url instead of kiwix_serve + zims for an
# external kiwix-serve.
# [reference]
# kiwix_serve = "C:/path/to/kiwix-serve.exe"
# zims = ["C:/path/to/wikipedia_en_top_nopic.zim", "C:/path/to/wikipedia_en_all_mini.zim"]
# port = 8830

# ALTERNATIVELY, instead of the block above (not together with it), use an already-running
# external kiwix-serve:
# [reference]
# base_url = "http://127.0.0.1:8830"

# Offline map (a PMTiles v3 vector map file plus Protomaps basemaps-assets for glyphs and
# sprites). Uncomment and edit; until then the Map button shows as unavailable. Places are
# looked up through the offline reference or web search above.
# [map]
# pmtiles = "C:/path/to/maps/world-z9.pmtiles"
# assets = "C:/path/to/maps/basemaps-assets"

# Web search for the "web" source: "duckduckgo" (default), "searxng", "brave" or "off".
# [web]
# search = "duckduckgo"
# searxng_url = "http://127.0.0.1:8888"
# api_key_file = "var/keys/brave.key"
